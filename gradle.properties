# This library's own version: -SNAPSHOT on develop, a release on main. The hub's catalog pins releases.
version=2.8.0-SNAPSHOT

# The platform this library builds on (platform.settings), without -SNAPSHOT, and where to take it
# from: local (~/.m2), snapshot (develop's) or release (main's). CI sets PLATFORM_SOURCE.
platformVersion=2.8.0
platformSource=snapshot

org.gradle.caching=true
org.gradle.configuration-cache=true

# google-java-format (Spotless) reads javac internals; the Gradle daemon must export them.
org.gradle.jvmargs=-Xmx2g --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
